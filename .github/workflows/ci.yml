# Gerbang otomatis minimal (docs/REFACTORING_REVIEW.md #6):
# - backend : compileall (sintaks/import) + pytest unit bebas-infra
# - frontend: eslint (react-hooks, error menggagalkan) + build produksi
# Kontrak terkurasi memakai Mongo/Redis sementara nyata. Suite live historis
# tetap terpisah; tidak pernah diarahkan ke database aplikasi/produksi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Membatalkan CI lama hanya SAH di cabang PR (push beruntun, hemat runner).
  # Di `main` setiap commit adalah kandidat deploy: deploy.yml hanya berjalan
  # bila CI-nya SELESAI SUKSES, jadi CI yang dibatalkan berarti commit itu
  # TIDAK PERNAH ter-deploy. Biasanya tertutupi deploy commit berikutnya —
  # tetapi bila deploy berikutnya gagal, commit itu hilang dari produksi tanpa
  # satu pun tanda kegagalan. Terjadi nyata 19 Agu 2026: CI 7828ff4 (perbaikan
  # 500 impor SIMAN) dibatalkan oleh merge empat menit sesudahnya, lalu deploy
  # berikutnya gagal karena VPS tak terjangkau.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    name: Audit dependency Python
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  rahasia:
    name: Pemeriksa rahasia (kredensial ter-commit)
    runs-on: ubuntu-latest
    # Batas bawaan GitHub 6 JAM. Langkah yang menggantung karena jaringan
    # runner (lihat langkah apt di job backend) membuat PR macet setengah hari
    # tanpa pernah gagal sendiri. Semua job ini normalnya selesai <5 menit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Kunci iLovePDF, Compresto, Uploadcare, WhipDoc, Tinify, Resend,
      # MONGO_URL, dan JWT_SECRET pernah ter-commit ke repositori PUBLIK dan
      # bertahan berminggu-minggu tanpa satu pun mekanisme menghalanginya.
      # JWT_SECRET yang terbaca publik berarti siapa pun dapat menempa token
      # super-admin dan membaca seluruh data BMN semua satker.
      - name: Cari kredensial di berkas ter-track
        run: python3 scripts/cek_rahasia.py

  backend:
    name: Backend (compileall + pytest unit)
    outputs:
      summary: ${{ steps.result.outputs.summary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - name: Dependensi sistem WeasyPrint (pango)
        # 18 Agu 2026: langkah ini menggantung 61 menit di cermin paket runner
        # tanpa pernah gagal sendiri, sementara dua job lain hijau dalam 2
        # menit. `timeout` dijalankan SEBAGAI ROOT (sudo timeout, bukan timeout
        # sudo) supaya apt benar-benar mati dan kunci /var/lib/dpkg terlepas
        # sebelum percobaan berikutnya.
        run: |
          for percobaan in 1 2 3; do
            if sudo timeout 240 apt-get update -o Acquire::Retries=3 \
               && sudo timeout 240 apt-get install -y --no-install-recommends \
                    -o Acquire::Retries=3 libpango-1.0-0 libpangoft2-1.0-0; then
              exit 0
            fi
            echo "Percobaan $percobaan/3 apt-get gagal atau menggantung — ulangi 15 detik…"
            sleep 15
          done
          echo "apt-get tetap gagal setelah 3 percobaan — cermin paket runner bermasalah."
          exit 1
      - name: Install dependensi Python
        run: |
          pip install -r backend/requirements-dev.txt
          pip check
      - name: Cek sintaks + bytecode seluruh backend
        run: python -m compileall -q backend -x 'venv|__pycache__'
      - name: Test unit bebas-infra
        run: >-
          pytest -q --junitxml="$RUNNER_TEMP/backend-unit.xml"
          --ignore=backend/tests/unit/test_deploy_fase.py
          --ignore=backend/tests/unit/test_backend_environment.py
          --ignore=backend/tests/unit/test_pinned_installer.py
          --ignore=backend/tests/unit/test_env_deploy.py
          --ignore=backend/tests/unit/test_deploy_controller.py
      - name: Ringkasan unit tanpa fixture
        id: result
        run: python scripts/ci_verification.py junit "$RUNNER_TEMP/backend-unit.xml"
      - name: Identitas tes gagal tanpa pesan atau fixture
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_failure_summary.py
          --junit "$RUNNER_TEMP/backend-unit.xml"
          --check-name 'Backend unit failure details' --expected-sha "$GITHUB_SHA"

  deploy-operations:
    name: Deploy dan rollback (Git + venv nyata)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 25
    outputs:
      summary: ${{ steps.result.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - name: Dependensi terkunci
        run: |
          pip install -r backend/requirements-dev.txt
          pip check
      - name: Fault injection filesystem dan proses nyata
        run: >-
          pytest -q --junitxml="$RUNNER_TEMP/deploy-operations.xml"
          backend/tests/unit/test_deploy_fase.py
          backend/tests/unit/test_backend_environment.py
          backend/tests/unit/test_pinned_installer.py
          backend/tests/unit/test_env_deploy.py
          backend/tests/unit/test_deploy_controller.py
      - name: Ringkasan operasi tanpa fixture
        id: result
        run: python scripts/ci_verification.py junit "$RUNNER_TEMP/deploy-operations.xml"
      - name: Identitas tes gagal tanpa pesan atau fixture
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_failure_summary.py
          --junit "$RUNNER_TEMP/deploy-operations.xml"
          --check-name 'Deployment failure details' --expected-sha "$GITHUB_SHA"

  frontend:
    name: Frontend (eslint + build)
    outputs:
      summary: ${{ steps.result.outputs.summary }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependensi
        run: yarn install --frozen-lockfile
      - name: eslint (react-hooks)
        run: yarn lint
      - name: Uji unit frontend (jest/craco)
        # Menjaga OCC, antrean offline, seleksi dan lifecycle cache. Jalankan
        # serial agar fixture UI tidak berebut CPU; suite kosong wajib gagal.
        run: CI=true yarn test --watchAll=false --runInBand --json --outputFile="$RUNNER_TEMP/frontend-jest.json"
      - name: Ringkasan frontend tanpa fixture
        id: result
        run: python ../scripts/ci_verification.py jest "$RUNNER_TEMP/frontend-jest.json"
      - name: Build produksi
        # CI=false: warning CRA lama tidak menggagalkan build; gerbang error
        # sudah dipegang langkah eslint di atas.
        env:
          REACT_APP_RELEASE_SHA: ${{ github.sha }}
        run: CI=false yarn build

  kontrak:
    name: Kontrak API (MongoDB + Redis nyata)
    outputs:
      summary: ${{ steps.result.outputs.summary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.30
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AMAN_CONTRACT_MONGO_URL: mongodb://127.0.0.1:27017
      AMAN_CONTRACT_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - name: Dependensi kontrak
        run: |
          pip install -r backend/requirements-dev.txt
          pip check
      - name: Uji handler, indeks, CAS, GridFS, cache, dan retry nyata
        run: pytest -m integration backend/tests/contract -q --junitxml="$RUNNER_TEMP/backend-contract.xml"
      - name: Ringkasan kontrak tanpa fixture
        id: result
        run: python scripts/ci_verification.py junit "$RUNNER_TEMP/backend-contract.xml"
      - name: Identitas tes gagal tanpa pesan atau fixture
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_failure_summary.py
          --junit "$RUNNER_TEMP/backend-contract.xml"
          --check-name 'Contract failure details' --expected-sha "$GITHUB_SHA"

  browser:
    name: Chromium (aplikasi nyata dan MongoDB)
    outputs:
      summary: ${{ steps.result.outputs.summary }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.30
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependensi terkunci
        run: |
          pip install -r backend/requirements-dev.txt
          pip check
          corepack yarn --cwd frontend install --frozen-lockfile
      - name: Uji browser dengan akun dan database sementara
        env:
          REACT_APP_RELEASE_SHA: ${{ github.sha }}
        run: >-
          python scripts/uji_browser_ci.py
          --mongo mongodb://127.0.0.1:27017/
          --chromium google-chrome
          --output "${RUNNER_TEMP}/browser-evidence"
      - name: Ringkasan browser tanpa fixture
        id: result
        run: python scripts/ci_verification.py browser "$RUNNER_TEMP/browser-evidence/hasil.json"
      - name: Simpan bukti tanpa akun, token, atau runtime.env
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: ignore
          retention-days: 7

  verification-evidence:
    name: Bukti verifikasi SHA rilis
    needs: [rahasia, dependency-audit, backend, deploy-operations, frontend, kontrak, browser]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: write
    env:
      VERIFICATION_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Publikasikan hitungan teruji tanpa output test
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = JSON.parse(process.env.VERIFICATION_NEEDS);
            for (const [name, job] of Object.entries(jobs)) {
              if (job.result !== 'success') throw new Error('Required gate did not pass: ' + name);
            }
            const summary = name => JSON.parse(jobs[name].outputs.summary);
            const unit = summary('backend'), operations = summary('deploy-operations');
            const report = {
              schema_version: 1, source_sha: context.sha, workflow_run_id: context.runId,
              backend: {unit, operations, passed: unit.passed + operations.passed},
              contracts: summary('kontrak'), frontend: summary('frontend'),
              browser: summary('browser'), python_runtime_dev_advisory_gates: 'passed'
            };
            const text = '```json\n' + JSON.stringify(report, null, 2) + '\n```';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Validasi rilis (teruji)', status: 'completed', conclusion: 'success',
              output: {title: 'All required gates passed on this exact source SHA', summary: text}
            });
            await core.summary.addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
