# Gerbang otomatis minimal (docs/REFACTORING_REVIEW.md #6):
# - backend : compileall (sintaks/import) + pytest unit bebas-infra
# - frontend: eslint (react-hooks, error menggagalkan) + build produksi
# Kontrak terkurasi memakai Mongo/Redis sementara nyata. Suite live historis
# tetap terpisah; tidak pernah diarahkan ke database aplikasi/produksi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Membatalkan CI lama hanya SAH di cabang PR (push beruntun, hemat runner).
  # Di `main` setiap commit adalah kandidat deploy: deploy.yml hanya berjalan
  # bila CI-nya SELESAI SUKSES, jadi CI yang dibatalkan berarti commit itu
  # TIDAK PERNAH ter-deploy. Biasanya tertutupi deploy commit berikutnya —
  # tetapi bila deploy berikutnya gagal, commit itu hilang dari produksi tanpa
  # satu pun tanda kegagalan. Terjadi nyata 19 Agu 2026: CI 7828ff4 (perbaikan
  # 500 impor SIMAN) dibatalkan oleh merge empat menit sesudahnya, lalu deploy
  # berikutnya gagal karena VPS tak terjangkau.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rahasia:
    name: Pemeriksa rahasia (kredensial ter-commit)
    runs-on: ubuntu-latest
    # Batas bawaan GitHub 6 JAM. Langkah yang menggantung karena jaringan
    # runner (lihat langkah apt di job backend) membuat PR macet setengah hari
    # tanpa pernah gagal sendiri. Semua job ini normalnya selesai <5 menit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Kunci iLovePDF, Compresto, Uploadcare, WhipDoc, Tinify, Resend,
      # MONGO_URL, dan JWT_SECRET pernah ter-commit ke repositori PUBLIK dan
      # bertahan berminggu-minggu tanpa satu pun mekanisme menghalanginya.
      # JWT_SECRET yang terbaca publik berarti siapa pun dapat menempa token
      # super-admin dan membaca seluruh data BMN semua satker.
      - name: Cari kredensial di berkas ter-track
        run: python3 scripts/cek_rahasia.py

  backend:
    name: Backend (compileall + pytest unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependensi sistem WeasyPrint (pango)
        # 18 Agu 2026: langkah ini menggantung 61 menit di cermin paket runner
        # tanpa pernah gagal sendiri, sementara dua job lain hijau dalam 2
        # menit. `timeout` dijalankan SEBAGAI ROOT (sudo timeout, bukan timeout
        # sudo) supaya apt benar-benar mati dan kunci /var/lib/dpkg terlepas
        # sebelum percobaan berikutnya.
        run: |
          for percobaan in 1 2 3; do
            if sudo timeout 240 apt-get update -o Acquire::Retries=3 \
               && sudo timeout 240 apt-get install -y --no-install-recommends \
                    -o Acquire::Retries=3 libpango-1.0-0 libpangoft2-1.0-0; then
              exit 0
            fi
            echo "Percobaan $percobaan/3 apt-get gagal atau menggantung — ulangi 15 detik…"
            sleep 15
          done
          echo "apt-get tetap gagal setelah 3 percobaan — cermin paket runner bermasalah."
          exit 1
      - name: Install dependensi Python
        run: pip install -r backend/requirements.txt
      - name: Cek sintaks + bytecode seluruh backend
        run: python -m compileall -q backend -x 'venv|__pycache__'
      - name: Test unit bebas-infra
        run: pytest -q

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependensi
        run: yarn install --frozen-lockfile
      - name: eslint (react-hooks)
        run: yarn lint
      - name: Uji unit frontend (jest/craco)
        # Menjaga logika klien kritis (OCC, antrean simpan optimistis, guard
        # unload, dll.). --passWithNoTests agar tak gagal bila suite kosong.
        run: CI=true yarn test --watchAll=false --passWithNoTests
      - name: Build produksi
        # CI=false: warning CRA lama tidak menggagalkan build; gerbang error
        # sudah dipegang langkah eslint di atas.
        run: CI=false yarn build

  kontrak:
    name: Kontrak API (MongoDB + Redis nyata)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.30
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AMAN_CONTRACT_MONGO_URL: mongodb://127.0.0.1:27017
      AMAN_CONTRACT_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependensi kontrak
        run: pip install -r backend/requirements.txt
      - name: Uji handler, indeks, CAS, GridFS, cache, dan retry nyata
        run: pytest -m integration backend/tests/contract -q
