# Auto-deploy ke VPS Hostinger — HANYA setelah workflow "CI" selesai SUKSES di
# main (mencegah commit yang GAGAL CI ter-deploy ke produksi). Juga bisa manual
# lewat tab Actions → "Deploy ke Hostinger VPS" → Run workflow.
#
# Alur: merge PR → push ke main memicu CI → CI hijau memicu deploy ini
# (via workflow_run). Bila CI merah, deploy tidak jalan.
#
# Butuh 3 secret repo (Settings → Secrets and variables → Actions):
#   VPS_HOST     — IP/hostname VPS
#   VPS_USER     — user SSH (mis. root)
#   VPS_SSH_KEY  — private key OpenSSH yang public key-nya ada di
#                  ~/.ssh/authorized_keys milik user tsb di VPS
# Opsional: VPS_PORT (default 22).
# Selama secret belum diset, job selesai dengan catatan (tidak gagal).
name: Deploy ke Hostinger VPS

on:
  # Dipicu saat workflow "CI" selesai. `branches: [main]` menyaring agar hanya
  # CI-run di cabang main (bukan PR) yang bisa memicu; gerbang sukses ada di
  # `if` job di bawah. Tetap sediakan trigger manual.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy HANYA bila: dijalankan manual, ATAU CI selesai dengan SUKSES.
    # CI merah → job ini di-skip → produksi tidak menerima commit gagal-CI.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Untuk workflow_run: ambil TEPAT commit yang lulus CI (skrip deploy
          # yang dipipe ke VPS). Untuk dispatch manual: default cabang terpilih.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::Deploy dilewati — set secret VPS_HOST, VPS_USER, dan VPS_SSH_KEY di Settings → Secrets and variables → Actions untuk mengaktifkan auto-deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          # Buang CR (tempel dari Windows) + pastikan newline penutup
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Alternatif anti-salah-tempel: secret berisi SATU baris base64
          # (hasil `base64 -w0 ~/deploy_key`) — didekode di sini.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
            chmod 600 ~/.ssh/deploy_key
          fi
          # Validasi kunci SEBELUM konek — pesan jelas bila isi secret rusak
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::Isi secret VPS_SSH_KEY bukan private key OpenSSH yang valid. Cara paling mudah: di VPS jalankan  base64 -w0 ~/deploy_key; echo  lalu salin SATU baris hasilnya ke secret VPS_SSH_KEY. (Atau salin utuh semua baris file kunci dari -----BEGIN sampai -----END.)"
            exit 1
          fi
          # Uji jangkauan host lebih dulu — dengan RETRY.
          #
          # Jendelanya diperpanjang setelah insiden 18 Agu 2026 00:38-00:41 UTC:
          # deploy gagal, dan log sshd VPS TIDAK MENCATAT APA PUN di rentang itu
          # — bukan koneksi ditolak, melainkan paketnya tak pernah sampai. Deploy
          # sebelum (00:20) dan sesudahnya (00:51) normal, dan `dmesg` tidak
          # menunjukkan satu pun OOM. Jadi penyebabnya di jalur jaringan sebelum
          # mesin (firewall/edge penyedia), bukan di VPS maupun aplikasi.
          #
          # Jendela lama 5x(15s timeout + 20s jeda) ~= 2,9 menit habis tepat di
          # dalam gangguan itu. Kini 8x(15s + 30s) ~= 6 menit: cukup untuk
          # melewati blip beberapa menit, masih jauh di bawah timeout job.
          #
          # Ini BANTALAN, bukan perbaikan. Gangguan jaringannya sendiri di luar
          # kendali repo dan perlu ditanyakan ke penyedia VPS.
          reachable=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh-keyscan -T 15 -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              reachable=1; break
            fi
            echo "Percobaan $attempt/8 gagal menjangkau VPS — coba lagi 30 detik…"
            sleep 30
          done
          if [ "$reachable" -ne 1 ]; then
            echo "::error::Tidak bisa terhubung ke VPS di port ${VPS_PORT:-22} setelah 8 percobaan (~6 menit). Bila secret VPS_HOST/VPS_PORT sudah benar dan VPS hidup, periksa firewall/proteksi DDoS di sisi PENYEDIA: pada insiden serupa, log sshd VPS tidak mencatat percobaan koneksi sama sekali."
            exit 1
          fi
          # SSH juga di-retry (2x) — koneksi bisa putus sesaat setelah keyscan
          if ! ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' < scripts/deploy_vps.sh; then
            echo "Deploy percobaan pertama gagal — ulang sekali dalam 30 detik…"
            sleep 30
            ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' < scripts/deploy_vps.sh
          fi
