# Auto-deploy ke VPS Hostinger — HANYA setelah workflow "CI" selesai SUKSES di
# main (mencegah commit yang GAGAL CI ter-deploy ke produksi). Commit yang
# dipasang dikunci ke SHA immutable yang lulus CI — bukan ujung branch main
# saat VPS kebetulan melakukan fetch. Deploy manual juga wajib menunjuk SHA
# main yang sudah memiliki run CI sukses.
#
# Alur: merge PR → push ke main memicu CI → CI hijau memicu deploy ini
# (via workflow_run). Bila CI merah, deploy tidak jalan.
#
# Butuh 3 secret repo (Settings → Secrets and variables → Actions):
#   VPS_HOST     — IP/hostname VPS
#   VPS_USER     — user SSH (mis. root)
#   VPS_SSH_KEY  — private key OpenSSH yang public key-nya ada di
#                  ~/.ssh/authorized_keys milik user tsb di VPS
# Opsional: VPS_PORT (default 22).
# Selama secret belum diset, job selesai dengan catatan (tidak gagal).
name: Deploy ke Hostinger VPS

on:
  # Dipicu saat workflow "CI" selesai. `branches: [main]` menyaring agar hanya
  # CI-run di cabang main (bukan PR) yang bisa memicu; gerbang sukses ada di
  # `if` job di bawah. Tetap sediakan trigger manual yang digerbang CI.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "SHA commit lengkap (40 karakter) di main yang sudah lulus CI"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy HANYA bila: dijalankan manual, ATAU CI PUSH selesai dengan SUKSES.
    # Run pull_request (termasuk rerun lama) bukan bukti rilis main.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    env:
      DEPLOY_SHA_MENTAH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.deploy_sha }}
      DEPLOY_CONTROLLER_MENTAH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_MODE: ${{ github.event_name == 'workflow_run' && 'otomatis' || 'manual' }}
    steps:
      - name: Validasi format SHA rilis
        id: rilis
        run: |
          if [[ ! "$DEPLOY_SHA_MENTAH" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::DEPLOY_SHA wajib berupa commit SHA lengkap 40 karakter heksadesimal; tidak boleh branch, tag, singkatan, atau kosong."
            exit 1
          fi
          if [[ ! "$DEPLOY_CONTROLLER_MENTAH" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::SHA pengendali deploy tidak sah."
            exit 1
          fi
          DEPLOY_SHA="${DEPLOY_SHA_MENTAH,,}"
          echo "controller=${DEPLOY_CONTROLLER_MENTAH,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$DEPLOY_MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # Pengendali berasal dari SHA workflow yang lulus CI. Saat rollback
          # manual, target lama tetap memakai protokol clean-venv pengendali ini.
          ref: ${{ steps.rilis.outputs.controller }}
          fetch-depth: 0
      - name: Validasi asal dan hasil CI commit rilis
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.rilis.outputs.sha }}
          DEPLOY_CONTROLLER_SHA: ${{ steps.rilis.outputs.controller }}
        run: |
          git fetch --no-tags origin main
          for AMAN_VALIDATED_SHA in "$DEPLOY_SHA" "$DEPLOY_CONTROLLER_SHA"; do
            if ! git cat-file -e "${AMAN_VALIDATED_SHA}^{commit}" 2>/dev/null \
                || ! git merge-base --is-ancestor "$AMAN_VALIDATED_SHA" origin/main; then
              echo "::error::Target atau pengendali deploy bukan commit main yang tersedia."
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$DEPLOY_SHA" != "$DEPLOY_CONTROLLER_SHA" ]; then
            echo "::error::Deploy otomatis wajib memakai target dan pengendali dari SHA CI yang sama."
            exit 1
          fi
          # Dispatch manual membuktikan CI push/main untuk target DAN pengendali.
          # Pengendali branch PR/tanpa CI tidak boleh menjalankan rollback lama.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            for AMAN_CI_SHA in "$DEPLOY_SHA" "$DEPLOY_CONTROLLER_SHA"; do
              hasil_ci="$(curl --fail-with-body --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$AMAN_CI_SHA&per_page=1")"
              if ! printf '%s' "$hasil_ci" | AMAN_CI_SHA="$AMAN_CI_SHA" python3 -c \
                'import json, os, sys; data=json.load(sys.stdin); sha=os.environ["AMAN_CI_SHA"]; sys.exit(0 if any(r.get("head_sha") == sha and r.get("head_branch") == "main" and r.get("event") == "push" and r.get("status") == "completed" and r.get("conclusion") == "success" for r in data.get("workflow_runs", [])) else 1)'; then
                echo "::error::Deploy manual ditolak: target atau pengendali belum lulus CI push/main."
                exit 1
              fi
            done
          fi

          # Pengendali wajib memahami SHA dan pergantian lingkungan terisolasi;
          # script target lama tidak boleh mengambil alih protokol rollback.
          grep -F 'git reset --hard "$DEPLOY_SHA"' scripts/deploy_vps.sh >/dev/null || {
            echo "::error::Pengendali belum mendukung deploy SHA immutable."
            exit 1
          }
          grep -Fx 'AMAN_CLEAN_VENV_PROTOCOL=1' scripts/deploy_vps.sh >/dev/null || {
            echo "::error::Pengendali belum mendukung lingkungan rilis terisolasi."
            exit 1
          }
      - name: Deploy via SSH
        env:
          DEPLOY_SHA: ${{ steps.rilis.outputs.sha }}
          DEPLOY_CONTROLLER_SHA: ${{ steps.rilis.outputs.controller }}
          DEPLOY_MODE: ${{ steps.rilis.outputs.mode }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::Deploy dilewati — set secret VPS_HOST, VPS_USER, dan VPS_SSH_KEY di Settings → Secrets and variables → Actions untuk mengaktifkan auto-deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          # Buang CR (tempel dari Windows) + pastikan newline penutup
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Alternatif anti-salah-tempel: secret berisi SATU baris base64
          # (hasil `base64 -w0 ~/deploy_key`) — didekode di sini.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true
            chmod 600 ~/.ssh/deploy_key
          fi
          # Validasi kunci SEBELUM konek — pesan jelas bila isi secret rusak
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::Isi secret VPS_SSH_KEY bukan private key OpenSSH yang valid. Cara paling mudah: di VPS jalankan  base64 -w0 ~/deploy_key; echo  lalu salin SATU baris hasilnya ke secret VPS_SSH_KEY. (Atau salin utuh semua baris file kunci dari -----BEGIN sampai -----END.)"
            exit 1
          fi
          # Koneksi ke VPS — SATU koneksi per percobaan, dengan retry.
          #
          # Riwayat rancangan ini penting supaya tak diputar balik lagi:
          #
          # 1. Semula probe `ssh-keyscan` lalu `ssh` — DUA koneksi tiap deploy.
          # 2. 18 Agu 2026 deploy gagal karena blip jaringan penyedia; jendela
          #    5x(15s+20s) ~= 2,9 menit habis tepat di dalam gangguan itu, jadi
          #    diperlebar ke 8x(15s+30s) ~= 6 menit.
          # 3. 19 Agu 2026 deploy gagal DUA KALI berturut-turut, keduanya
          #    menghabiskan jendela 6 menit penuh tanpa port 22 menjawab sekali
          #    pun — padahal delapan deploy sebelumnya pada hari yang sama
          #    sukses.
          #
          # Kegagalan pertama terjadi tepat pada run PERTAMA yang memakai
          # jendela lebar itu. Cerita yang konsisten dengan seluruh fakta: blip
          # sesaat -> 8 percobaan beruntun -> fail2ban/proteksi penyedia membaca
          # polanya sebagai percobaan penyusupan -> IP runner diblokir -> semua
          # deploy sesudahnya gagal. Belum terbukti (butuh `fail2ban-client
          # status sshd` di VPS), tetapi rancangan di bawah lebih baik pada
          # KEDUA kemungkinan, jadi tak perlu menunggu kepastian:
          #
          # - Kesabaran DIPERPANJANG melewati bantime lazim, tekanan tetap
          #   rendah: 5 percobaan berjeda 180 detik (~14 menit), bukan 8
          #   berjeda 30 detik (~6 menit).
          #
          #   Angka 14 menit itu punya alasan. Pada 19 Agu 13:32 UTC deploy
          #   gagal lagi, dan pesan ssh-nya kini spesifik: "connect to host
          #   port 22: Connection timed out". TIMED OUT, bukan "refused" —
          #   paket SYN-nya dijatuhkan diam-diam, persis yang dilakukan aturan
          #   iptables DROP milik fail2ban. sshd yang mati akan menjawab
          #   "Connection refused"; host yang hilang menjawab "No route to
          #   host". Jendela 6 menit lebih pendek daripada bantime bawaan
          #   fail2ban (10 menit), jadi seberapa pun sabarnya ia tetap habis
          #   di dalam masa blokir. 14 menit melewatinya.
          # - Probe `ssh-keyscan` DIHAPUS; `StrictHostKeyChecking=accept-new`
          #   melakukan hal yang sama pada koneksi yang memang dipakai. Model
          #   kepercayaannya identik - keduanya trust-on-first-use - tetapi tiap
          #   percobaan kini satu koneksi, bukan dua.
          # - Hanya kegagalan TINGKAT KONEKSI (ssh keluar 255) yang diulang.
          #   Skrip deploy yang benar-benar berjalan lalu gagal TIDAK diulang:
          #   mengulangnya hanya menjalankan ulang kegagalan yang sama sambil
          #   menyamarkan sebabnya sebagai "masalah jaringan".
          #
          # Ini tetap BANTALAN, bukan perbaikan. Gangguan di sisi penyedia
          # perlu diselesaikan di sana.
          rc=0
          for attempt in 1 2 3 4 5; do
            rc=0
            ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=20 \
                "$VPS_USER@$VPS_HOST" "bash -s -- '$DEPLOY_SHA' '$DEPLOY_MODE' '$DEPLOY_CONTROLLER_SHA'" < scripts/deploy_vps.sh || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$rc" -ne 255 ]; then
              # JANGAN menyimpulkan "bukan masalah jaringan" di sini. Deploy
              # 1 Sep 2026 keluar dengan 128 karena VPS-nya sendiri tak bisa
              # menjangkau github.com:443 — masalah jaringan tulen, di kaki
              # yang tak dilihat langkah ini. Pesan lama mengirim pembacanya
              # mencari cacat kode yang tidak ada. Yang PASTI diketahui di
              # sini hanyalah: koneksi runner ke VPS berhasil.
              echo "::error::Koneksi runner ke VPS BERHASIL, tetapi skrip deploy keluar dengan $rc. Sebabnya ada di keluaran skrip di atas - bisa cacat kode, bisa juga jaringan VPS ke luar (mis. git fetch ke github.com gagal). Skrip menandai sendiri bila yang terjadi adalah 'GAGAL JARINGAN DI SISI VPS'."
              exit "$rc"
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Percobaan $attempt/5 gagal menjangkau VPS (exit 255) - coba lagi 180 detik…"
              sleep 180
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Tidak bisa terhubung ke VPS di port ${VPS_PORT:-22} setelah 5 percobaan (~14 menit). Gejalanya 'Connection timed out' - paket dijatuhkan diam-diam, bukan ditolak; sshd yang mati akan menjawab 'Connection refused'. Di VPS jalankan 'fail2ban-client status sshd' untuk melihat IP yang sedang terblokir, dan periksa firewall/proteksi DDoS penyedia."
            exit 1
          fi
